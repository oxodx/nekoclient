# Access transformer for NeoForge.
#
# Mirrors common/src/main/resources/nekoclient.classtweaker, which is the Fabric class tweaker
# and is only applied by the Fabric loader. NeoForge uses the AccessTransformers library
# instead, so without this file every widened member below stays private on NeoForge and the
# shared code that touches it fails at runtime.
#
# Syntax: <modifier>[-f] <class> <member>
#   class only          -> public <class>
#   method              -> public <class> <name>(<descriptor>)
#   field               -> public <class> <name> <descriptor>
#
# Keep in sync with nekoclient.classtweaker:
#   accessible class  <class>            -> public <class>
#   accessible method <class> <name> <d>  -> public <class> <name><d>
#   accessible field  <class> <name> <d>  -> public <class> <name> <d>

