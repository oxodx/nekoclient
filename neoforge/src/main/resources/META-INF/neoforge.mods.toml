modLoader = "javafml"
loaderVersion = "[2,)"
license = "GPL-3.0"
issueTrackerURL = "https://github.com/oxodx/nekoclient/issues"

[[mods]]
modId = "nekoclient"
version = "${version}"
displayName = "NekoClient"
displayURL = "https://github.com/oxodx/nekoclient"
iconFile = "assets/nekoclient/icon.png"
description = '''
Based utility mod.
'''

# NeoForge's IModInfo does not expose the `authors` list from the mod metadata, so the same
# values are declared here as a mod property and read back by NekoClientNeoForge. NeoForge reads
# this table as `modproperties.<modId>` and stores entries under the names written here, so the
# keys must be bare rather than `nekoclient:`-prefixed, and the authors are comma-separated
# because only scalar values are guaranteed to survive the TOML round-trip.
[modproperties.nekoclient]
authors = "oxod_,MineGame159,squidoodly,seasnail"
color = "145,61,226"
commit = "${commit}"

[[mixins]]
config = "nekoclient.mixins.json"

[[mixins]]
config = "nekoclient-core.mixins.json"

# NeoForge uses the AccessTransformers library rather than Fabric's class tweaker, so the
# widened members the shared code relies on are declared here instead. This must stay in sync
# with common/src/main/resources/nekoclient.classtweaker.
[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

# Loader-specific compat: sodium/lithium/iris/indigo/viafabricplus/modmenu are Fabric mods, so
# those configs are registered by the fabric module only and are intentionally absent here.

[[dependencies.nekoclient]]
modId = "neoforge"
type = "required"
versionRange = "[26.2,)"
ordering = "NONE"
side = "CLIENT"
