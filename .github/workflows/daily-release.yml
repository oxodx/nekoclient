name: Daily Release

on:
  schedule:
    # 23:00 UTC = 00:00 in Amsterdam (CET). During CEST it lands an hour later.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: current

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build
        run: gradle build -Pcommit=${{ github.sha }}

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Nothing new since the last release means no new version.
          last=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          last_sha=$(git rev-list -n 1 "$last" 2>/dev/null || true)
          if [ -n "$last_sha" ] && [ "$last_sha" = "$GITHUB_SHA" ]; then
            echo "$GITHUB_SHA is already released as $last; nothing to do."
            exit 0
          fi

          tag=$(TZ=Europe/Amsterdam date +%y.%m.%d)
          jars=$(ls fabric/build/libs/nekoclient-fabric-*.jar \
                    neoforge/build/libs/nekoclient-neoforge-*.jar \
                | grep -vE -- '-(sources|javadoc)\.jar$')

          gh release create "$tag" $jars \
            --title "$tag" \
            --notes "Automated build of $GITHUB_SHA." \
            --latest=false
          echo "Released $tag"
