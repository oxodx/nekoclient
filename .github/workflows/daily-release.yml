name: Daily Release

on:
  schedule:
    # 23:00 UTC = 00:00 in Amsterdam (CET). During CEST it lands an hour later.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The date and the commit identify the build, so the tag is unique by construction and
      # re-running the same commit is the only case that has to be skipped.
      - name: Work out the tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(TZ=Europe/Amsterdam date +%Y.%m.%d)-${GITHUB_SHA:0:7}"

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already published; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing as $tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: current

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build
        if: steps.tag.outputs.skip != 'true'
        run: gradle build -PreleaseVersion=${{ steps.tag.outputs.tag }}

      - name: Release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t files < <(ls fabric/build/libs/*.jar neoforge/build/libs/*.jar)
          gh release create "${{ steps.tag.outputs.tag }}" "${files[@]}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --generate-notes \
            --latest=false
          echo "Released ${{ steps.tag.outputs.tag }}"
