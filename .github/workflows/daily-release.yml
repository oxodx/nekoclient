name: Daily Release

on:
  schedule:
    # 23:00 UTC = 00:00 in Amsterdam (CET). During CEST it lands an hour later.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      # Skip when the source tree already matches the latest release; otherwise the date and
      # commit identify the build, so re-running a partially-published tag is also skipped.
      - name: Work out the tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          latest="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [ -n "$latest" ] && git rev-parse --verify --quiet "$latest^{tree}" > /dev/null; then
            if [ "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$latest^{tree}")" ]; then
              echo "Files match the latest release ($latest); nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          tag="$(TZ=Europe/Amsterdam date +%Y.%m.%d)-${GITHUB_SHA:0:7}"

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already published; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing as $tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: current

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build
        if: steps.tag.outputs.skip != 'true'
        run: gradle build -PreleaseVersion=${{ steps.tag.outputs.tag }}

      - name: Release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t files < <(ls fabric/build/libs/*.jar neoforge/build/libs/*.jar)
          gh release create "${{ steps.tag.outputs.tag }}" "${files[@]}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --generate-notes \
            --latest=false
          echo "Released ${{ steps.tag.outputs.tag }}"
