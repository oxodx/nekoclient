name: Build Pull Request

on:
  pull_request:

permissions:
  contents: read

# Superseded runs are cancelled: pushing a second commit to a PR makes the first
# run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Reuses the exact build used for master, so a green PR means the same thing a
    # post-merge build will. Secrets are not passed through: forks can open PRs
    # against this repository, and a reusable-workflow call would otherwise
    # expose them.
    uses: ./.github/workflows/build.yml
